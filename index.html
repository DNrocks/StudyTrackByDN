<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <div class="app-container">
    <div class="main-content">
      <h1>📚 Study Tracker</h1>
      
      <!-- Profile Management -->
      <div class="profile-section">
        <select id="profileSelect"></select>
        <input type="text" id="newProfileName" placeholder="New profile name"/>
        <button id="createProfileBtn">Create Profile</button>
        <button id="deleteProfileBtn" class="danger">Delete Profile</button>
      </div>

      <!-- Session Controls -->
      <div class="session-controls">
        <button id="startSessionBtn">Start Session</button>
        <button id="endSessionBtn" disabled>End Session</button>
        <div id="timer">00:00:00</div>
        <button id="pauseTimerBtn" disabled>Pause</button>
      </div>

      <!-- Question Controls -->
      <div class="question-controls">
        <button id="correctBtn" class="correct">✔ Correct</button>
        <button id="wrongBtn" class="wrong">✘ Wrong</button>
        <button id="skippedBtn" class="skipped">➖ Skipped</button>
      </div>

      <!-- Question Grid -->
      <div id="questionGrid"></div>

      <!-- Session History -->
      <h2>📜 Session History</h2>
      <ul id="sessionHistory"></ul>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <button id="darkModeToggle">🌙 Toggle Dark Mode</button>
      <button id="exportPdfBtn">📑 Export PDF</button>
      <button id="exportJsonBtn">💾 Export JSON</button>
      <input type="file" id="importJsonInput" accept=".json" hidden/>
      <button id="importJsonBtn">📂 Import JSON</button>
      <button id="statsBtn">📊 View Stats</button>
      <button id="graphsBtn">📈 View Graphs</button>
    </div>
  </div>

  <!-- Graph Modal -->
  <div id="graphModal" class="modal">
    <div class="modal-content">
      <span id="closeGraphModal" class="close">&times;</span>
      <canvas id="weeklyChart"></canvas>
      <canvas id="monthlyChart"></canvas>
    </div>
  </div>
</body>
</html>
